version: "3.9"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: brand-analysis-api
    ports:
      - "8091:8000"
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=devpassword
      - DB_NAME=geo
      - DB_CHARSET=utf8mb4
    depends_on:
      - mysql

  web:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./web:/app
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0 --port 3000"
    ports:
      - "3000:3000"
    environment:
      - VITE_API_TARGET=http://api:8000
    depends_on:
      - api
      - mysql

  web-prod:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: brand-analysis-web
    ports:
      - "8080:80"
    depends_on:
      - api
      - mysql

  mysql:
    image: mysql:8.0
    container_name: brand-analysis-mysql
    restart: unless-stopped
    environment:
      - MYSQL_ROOT_PASSWORD=devpassword
      - MYSQL_DATABASE=geo
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
