services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: brand-analysis-api-dev
    restart: unless-stopped
    volumes:
      - ./api:/app/api
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=192.168.31.233
      - DB_PORT=3306
      - DB_USER=root
      - DB_PASSWORD=123456
      - DB_NAME=geo
      - DB_CHARSET=utf8mb4

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: brand-analysis-web-dev
    restart: unless-stopped
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_TARGET=http://api:8000
      - VITE_USE_MOCK=false
      - VITE_DEFAULT_USER_ID=38e71daf-98b1-4230-9c78-a0364fd07f8f
      - VITE_DEFAULT_JOB_ID=job_20260114_143606_dae12d36
      - VITE_DEFAULT_BRAND=哈基桃电竞
    depends_on:
      - api

networks:
  default:
    name: brand-analysis-dev-network
