# SQLite development environment.
# Usage: docker compose -f docker-compose.sqlite.yml up
#
# Differences from docker-compose.dev.yml:
# - Does not depend on an external MySQL service.
# - Persists the SQLite database at ./data/geo_csv/geo_migrated.db.
# - Intended for local development and lightweight deployment checks.

services:
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    container_name: brand-analysis-api-sqlite
    restart: unless-stopped
    volumes:
      - ./api:/app/api
      - ./data:/app/data
    ports:
      - "8000:8000"
    environment:
      - DB_DIALECT=sqlite
      - DB_SQLITE_PATH=/app/data/geo_csv/geo_migrated.db

  web:
    build:
      context: ./web
      dockerfile: Dockerfile.dev
    container_name: brand-analysis-web-sqlite
    restart: unless-stopped
    volumes:
      - ./web:/app
      - /app/node_modules
    ports:
      - "8443:3000"
    environment:
      - VITE_API_TARGET=http://api:8000
      - VITE_USE_MOCK=false
      - VITE_DEFAULT_TENANT_KEY=tn_6e1f78442bae
      - VITE_DEFAULT_JOB_ID=job_20260209_123550_e9ba00f6
      - VITE_DEFAULT_BRAND=QuickCEP
    depends_on:
      - api

networks:
  default:
    name: brand-analysis-sqlite-network
