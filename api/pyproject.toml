[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "brand-dashboard-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.136,<0.137",
    "starlette>=1.0,<2.0",
    "uvicorn[standard]>=0.30,<0.31",
    "pydantic>=2.7,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "pymysql>=1.1,<2.0",
    "fastapi-structlog>=0.6,<1.0",
    "asgi-correlation-id>=4.3,<5.0",
    "python-dotenv>=1.0,<2.0",
    "structlog>=24.0,<26.0",
    "openai>=1.0,<3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<10.0"]

[tool.uv]
package = true

[tool.hatch.build.targets.wheel]
packages = ["api"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["api"]

[tool.ruff.lint]
select = ["E", "F", "I"]
